name: overpass-test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  schedule:

    # Run every Sunday at 6:05 am
    - cron:  '5 6 * * 0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    # Tests runner is functional
    - name: Workflow test
      run: echo Good morning!
      
      # Runs Bikeep integration tests against the live API
    - name: Test Bikeep
      env:
        BIKEEP_CLIENT_SECRET: '${{ secrets.BIKEEP_CLIENT_SECRET }}'
        BIKEEP_CLIENT_ID: '${{ secrets.BIKEEP_CLIENT_ID }}'
        RUN_BIKEEP_LIVE_TESTS: 1
      run: |
        echo Testing Bikeep integration...
        chmod +x emission/individual_tests/setup_and_test_integration.sh
        ./emission/individual_tests/setup_and_test_integration.sh emission/tests/netTests/TestBikeepServiceIntegration.py
