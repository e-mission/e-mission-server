name: overpass-test

on:
  schedule:

    # Run every Sunday at 6:05 am
    - cron:  '5 6 * * 0'
jobs:
  api:
    name: Overpass API integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Test Overpass API
      env:
        GEOFABRIK_OVERPASS_KEY: '${{ secrets.GEOFABRIK_OVERPASS_KEY }}'
      run: |
        chmod +x emission/individual_tests/setup_and_test_integration.sh
        ./emission/individual_tests/setup_and_test_integration.sh emission/individual_tests/TestOverpass.py

  consumption:
    name: Overpass consumption integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install and start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: 8.0.19

    - name: Test Overpass consumption and intake pipeline
      env:
        GEOFABRIK_OVERPASS_KEY: '${{ secrets.GEOFABRIK_OVERPASS_KEY }}'
      run: |
        chmod +x emission/individual_tests/setup_and_test_integration.sh
        ./emission/individual_tests/setup_and_test_integration.sh emission/individual_tests/TestOverpassConsumption.py
