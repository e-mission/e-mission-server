version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "conda"
    directory: "/setup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      conda-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
